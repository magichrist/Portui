[project]
name = "ports-explorer"
version = "1.0.0"
description = "Interactive terminal explorer for macOS processes, network sockets and open descriptors."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ports Explorer contributors" }]
keywords = ["tui", "textual", "macos", "lsof", "processes", "network", "diagnostics"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "textual>=0.86",
    "rich>=13.7",
    "psutil>=6.0",
]

[project.urls]
Homepage = "https://github.com/example/ports-explorer"
Issues = "https://github.com/example/ports-explorer/issues"

[project.scripts]
ports-explorer = "ports_explorer.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ports_explorer*"]

[tool.setuptools.package-data]
ports_explorer = ["styles/*.tcss"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "C4",  # comprehensions
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length is handled by the formatter
    "RUF001", # ambiguous unicode characters in strings (we use gummy glyphs deliberately)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]